name: Atualizar dados da NBA

on:
  schedule:
    # 05:00 no horário de Brasília (UTC-3) = 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências do pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Rodar pipeline
        run: python pipeline/main.py

      - name: Commit e push dos dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados. Nada para commitar."
          else
            git commit -m "chore(data): atualizar dados da NBA"
            git push
          fi

      - name: Disparar deploy na Vercel
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl --fail -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
